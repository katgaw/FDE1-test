[project]
name = "hive-fde-challenge"
version = "0.1.0"
description = "The Hive FDE Challenge — set up your machine, and get concrete about the problem"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core LLM
    "litellm>=1.90",
    "openai>=1.66",
    "anthropic>=0.40",
    "python-dotenv>=1.2",
    "pydantic>=2.9",
    "openai-agents>=0.2,<1",
    "cryptography>=43,<46",  # keep local x86 macOS installs on binary wheels for MCP/Agents deps

    # LangChain 1.x line + RAG stack
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-community>=0.4",
    "langchain-openai>=1.3",
    "langchain-qdrant>=1.1",
    "langchain-tavily>=0.2,<0.3",
    "langchain-text-splitters>=1.1",
    "langgraph>=1,<2",
    "qdrant-client>=1.12",
    "chromadb>=1.0",
    # onnxruntime 1.24+ no longer publishes Intel macOS wheels.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers>=5.0",
    # torch 2.3+ no longer publishes Intel macOS wheels.
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # transformers 5 requires torch 2.5+, which is unavailable on Intel macOS.
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everywhere else transformers 5 is in play, so torch has to be new enough for it.
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",

    # Data / viz
    "numpy>=1.26",
    # torch 2.2.x Intel macOS wheels were built against the NumPy 1.x ABI.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pandas>=2.2,!=3.0.4",  # 3.0.4 was yanked for datetime-related segfaults
    "matplotlib>=3.9",
    "rich>=13.7",

    # Advanced retrieval
    "cohere>=5.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0.0",

    # Tools / Skills / MCP
    "mcp>=1.2",

    # API demos
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # Evaluation
    "deepeval>=4.1,<5",

    # GraphRAG notebook
    "networkx>=3.4",
    "spacy>=3.8",

    # Prompt optimization notebook
    "dspy>=3.2",
    "optuna>=3.6",
    "pwntools>=4.13",

    # Notebooks
    "notebook>=7.4",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbconvert>=7.0",
    "marimo>=0.24",
]
